[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alien-tech-scrambler"
version = "0.1.0"
description = "Advanced privacy toolkit for phones, devices, and signals with hybrid crypto and 1M+ validated simulations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Builder", email = "builder@example.com"}
]
dependencies = [
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
keyring = ["python-keyring>=25.0.0"]

[project.scripts]
alien-scrambler = "scrambler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
