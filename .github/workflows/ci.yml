name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps (pinned to verified-passing versions)
        run: |
          pip install numpy==2.0.2 scipy==1.14.1 cryptography==49.0.0 argon2-cffi keyring pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest tests/ -q
